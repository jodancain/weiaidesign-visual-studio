# Minimal config for the Node gateway.
#
# The gateway only ever reads three keys from this file (node-gateway.mjs L111-113):
#   openai_base_url   - now supplied by env IMAGE_OPENAI_BASE_URL (env takes precedence)
#   openai_api_key    - now supplied by env IMAGE_OPENAI_API_KEY  (env takes precedence)
#   openai_model_name - consumed here; used as the storyboard/prompt chat model
#
# The previous container carried a 2026-05-28 config.toml that still pointed at the
# retired api.yundongyl.cn upstream with a stale key. Those keys are deliberately
# omitted so a future env change cannot silently fall back to a dead endpoint.
openai_model_name = "gpt-5.4-mini"
