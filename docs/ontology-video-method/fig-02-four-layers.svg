<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" role="img" aria-label="图2 本体视频法四层框架" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;max-width:960px;display:block;margin:0 auto">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs>
<rect width="960" height="500" fill="#FFFFFF" rx="12"/>
<rect x="30" y="30" width="110" height="70" rx="10" fill="#7A5AF8" stroke="#7A5AF8" stroke-width="1.5"/>
<text x="85.0" y="70.6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">叙事层</text>
<rect x="150" y="30" width="500" height="70" rx="10" fill="#EEE9FE" stroke="#7A5AF8" stroke-width="1.5"/>
<text x="400.0" y="69.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">镜头 Shot · 段落 Sequence · 旁白 Narration · 字幕 Caption</text>
<rect x="670" y="38" width="120" height="26" rx="13" fill="#fff" stroke="#7A5AF8" stroke-width="1.5"/>
<text x="730.0" y="55.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7A5AF8">AI</text>
<text x="670" y="88" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">只在这一层创建实例（填有界槽位）</text>
<rect x="30" y="122" width="110" height="70" rx="10" fill="#F28C28" stroke="#F28C28" stroke-width="1.5"/>
<text x="85.0" y="162.6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">动作层</text>
<rect x="150" y="122" width="500" height="70" rx="10" fill="#FDEEDC" stroke="#F28C28" stroke-width="1.5"/>
<text x="400.0" y="161.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">步骤 Step · 动作 Action · 工具 Tool · 警示 Warning · 证据片段 Evidence</text>
<rect x="670" y="130" width="120" height="26" rx="13" fill="#fff" stroke="#F28C28" stroke-width="1.5"/>
<text x="730.0" y="147.2" text-anchor="middle" font-size="12" font-weight="700" fill="#F28C28">人 + AI 起草</text>
<text x="670" y="180" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">来自 SOP / 维修方案，步骤必须挂证据</text>
<rect x="30" y="214" width="110" height="70" rx="10" fill="#2F6FED" stroke="#2F6FED" stroke-width="1.5"/>
<text x="85.0" y="254.6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">场景层</text>
<rect x="150" y="214" width="500" height="70" rx="10" fill="#E8F0FE" stroke="#2F6FED" stroke-width="1.5"/>
<text x="400.0" y="253.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">车辆 · 系统 · 总成 · 零件 Part · 连接 Connection · 人物 Actor · 锚图 AnchorImage</text>
<rect x="670" y="222" width="120" height="26" rx="13" fill="#fff" stroke="#2F6FED" stroke-width="1.5"/>
<text x="730.0" y="239.2" text-anchor="middle" font-size="12" font-weight="700" fill="#2F6FED">人审锚图</text>
<text x="670" y="272" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">对象 / 链接 / 属性值各挂锁定图</text>
<rect x="30" y="306" width="110" height="70" rx="10" fill="#8E8E93" stroke="#8E8E93" stroke-width="1.5"/>
<text x="85.0" y="346.6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">治理层</text>
<rect x="150" y="306" width="500" height="70" rx="10" fill="#F2F2F7" stroke="#8E8E93" stroke-width="1.5"/>
<text x="400.0" y="345.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">资料底本 · 证据指纹 · 维护人 · 技术复核 / 业务签认状态 · 版本适用</text>
<rect x="670" y="314" width="120" height="26" rx="13" fill="#fff" stroke="#8E8E93" stroke-width="1.5"/>
<text x="730.0" y="331.2" text-anchor="middle" font-size="12" font-weight="700" fill="#8E8E93">复核人签认</text>
<text x="670" y="364" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">原样复用 M9 六步法字段，不另起一套</text>
<text x="85" y="394" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">↑ 上三层是本体内容，最底层是治理字段</text>
<rect x="150" y="425" width="500" height="36" rx="10" fill="#fff" stroke="#C7C7CC" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="400.0" y="447.6" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">输出：mp4 + srt + evidence-manifest.json + shots.json</text>
<line x1="400" y1="376" x2="400" y2="425" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="480.0" y="486" text-anchor="middle" font-size="12" font-weight="400" fill="#8E8E93">图 2 · AI 的写权限只到叙事层；动作层由人与 AI 共同起草，场景层与治理层完全由人把关</text>
</svg>