<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" role="img" aria-label="图4 属性值分三档" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;max-width:960px;display:block;margin:0 auto">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs>
<rect width="960" height="330" fill="#FFFFFF" rx="12"/>
<rect x="30" y="30" width="285" height="40" rx="10" fill="#2F6FED" stroke="#2F6FED" stroke-width="1.5"/>
<text x="172.5" y="55.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">① 事实属性</text>
<rect x="30" y="70" width="285" height="190" rx="10" fill="#E8F0FE" stroke="#2F6FED" stroke-width="1.5"/>
<text x="172.5" y="165.3" text-anchor="middle" font-size="1" font-weight="400" fill="#1d1d1f"></text>
<text x="172" y="95" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">手册 / BOM / 数模，带证据</text>
<text x="54" y="125" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  零件包围盒</text>
<text x="54" y="151" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  连接数量 qty</text>
<text x="54" y="177" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  扭矩 torque</text>
<text x="54" y="203" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  适用版本</text>
<rect x="90" y="270" width="165" height="32" rx="10" fill="#fff" stroke="#2F6FED" stroke-width="1.5"/>
<text x="172.5" y="290.6" text-anchor="middle" font-size="13" font-weight="700" fill="#2F6FED">AI 不可写</text>
<rect x="335" y="30" width="285" height="40" rx="10" fill="#8E8E93" stroke="#8E8E93" stroke-width="1.5"/>
<text x="477.5" y="55.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">② 派生属性</text>
<rect x="335" y="70" width="285" height="190" rx="10" fill="#F2F2F7" stroke="#8E8E93" stroke-width="1.5"/>
<text x="477.5" y="165.3" text-anchor="middle" font-size="1" font-weight="400" fill="#1d1d1f"></text>
<text x="477" y="95" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">函数按事实属性算出</text>
<text x="359" y="125" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  相机位置</text>
<text x="359" y="151" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  爆炸位移上限</text>
<text x="359" y="177" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  关键帧时间</text>
<text x="359" y="203" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  取景边距</text>
<rect x="395" y="270" width="165" height="32" rx="10" fill="#fff" stroke="#8E8E93" stroke-width="1.5"/>
<text x="477.5" y="290.6" text-anchor="middle" font-size="13" font-weight="700" fill="#8E8E93">AI 不可写</text>
<rect x="640" y="30" width="285" height="40" rx="10" fill="#7A5AF8" stroke="#7A5AF8" stroke-width="1.5"/>
<text x="782.5" y="55.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">③ 决策属性</text>
<rect x="640" y="70" width="285" height="190" rx="10" fill="#EEE9FE" stroke="#7A5AF8" stroke-width="1.5"/>
<text x="782.5" y="165.3" text-anchor="middle" font-size="1" font-weight="400" fill="#1d1d1f"></text>
<text x="782" y="95" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">创建实例时填，值域有界</text>
<text x="664" y="125" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  framing ∈ {wide, medium, close}</text>
<text x="664" y="151" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  duration_s ∈ [2, 12]</text>
<text x="664" y="177" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  explode_ratio ∈ [0, 1]</text>
<text x="664" y="203" text-anchor="start" font-size="13" font-weight="400" fill="#1d1d1f">•  target ∈ 已存在的 Part</text>
<rect x="700" y="270" width="165" height="32" rx="10" fill="#fff" stroke="#7A5AF8" stroke-width="1.5"/>
<text x="782.5" y="290.6" text-anchor="middle" font-size="13" font-weight="700" fill="#7A5AF8">AI 只填这一档</text>
<line x1="315" y1="150" x2="335" y2="150" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="325" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">→ 算</text>
<line x1="620" y1="150" x2="640" y2="150" stroke="#6e6e93" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="630" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">→ 约束</text>
<text x="480.0" y="316" text-anchor="middle" font-size="12" font-weight="400" fill="#8E8E93">图 4 · “AI 只填数值”的准确含义：AI 执行“创建 Shot”动作，参数就是第③档；越界或引用不存在对象则整个动作失败</text>
</svg>