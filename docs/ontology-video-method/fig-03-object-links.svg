<text x="480.0" y="546" text-anchor="middle" font-size="12" font-weight="400" fill="#8E8E93">图 3 · 蓝 = 场景对象，橙 = 动作与证据，紫 = 叙事，绿 = 锁定图；对象、链接实例、属性取值都可以钉一张图</text>
